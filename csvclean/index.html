<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>csvclean — CSV 数据清洗与体检 | newsroom-kit</title>
<meta name="description" content="拖入 CSV 文件，自动检测分隔符与编码（UTF-8/GB18030），报告混合分隔符、引号不闭合、空列、数字列混入文本、重复行等问题；勾选清洗动作，本地完成，数据不上传。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b23a29'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='bold' fill='%23fdf9f0' text-anchor='middle'%3Ev%3C/text%3E%3C/svg%3E" />
<link rel="canonical" href="https://icgma.github.io/newsroom-kit/csvclean/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="newsroom-kit 新闻人工具箱" />
<meta property="og:title" content="csvclean — CSV 数据清洗与体检" />
<meta property="og:description" content="编码、分隔符、混合分隔符、空列、重复行——问卷导出的数据先洗一遍。" />
<meta property="og:url" content="https://icgma.github.io/newsroom-kit/csvclean/" />
<meta property="og:locale" content="zh_CN" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <a class="back-link" href="../index.html" title="返回工具箱">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M10.5 2 5 8l5.5 6 1.4-1.4L7.8 8l4.1-4.6Z"/></svg>
        工具箱
      </a>
      <span class="seal" aria-hidden="true">v</span>
      <span class="wordmark">csvclean</span>
      <span class="tag">CSV 清洗</span>
    </div>
    <div class="topbar-right">
      <span class="chip" title="所有处理在本机浏览器完成">
        <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1 2 4v4c0 3.6 2.6 6.8 6 7.8 3.4-1 6-4.2 6-7.8V4L8 1Zm0 2.2L13 5.4v2.6c0 2.8-2 5.3-5 6.2-3-.9-5-3.4-5-6.2V5.4L8 3.2Z"/></svg>
        <span class="chip-label">数据不上传</span>
      </span>
      <button class="theme-toggle" id="themeToggle" type="button" title="切换主题">
        <svg class="ico-auto" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm0 1.6A5.4 5.4 0 0 0 8 13.4V2.6Z" opacity=".9"/><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm1.2 1.63a5.4 5.4 0 0 1 0 10.74V2.63Z" opacity=".45"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-8.5V.8m0 14.4v-1.7m3.9-9.6 1.2-1.2M2.9 13.1l1.2-1.2m0-7.8L2.9 2.9m10.2 10.2-1.2-1.2M13.5 8h1.7M.8 8h1.7"/></svg>
        <svg class="ico-moon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M6.5 2A6 6 0 0 0 8 13.9 6 6 0 0 1 6.5 2Zm2.8-.9a7.5 7.5 0 1 0 5.6 9.3 6 6 0 0 1-5.6-9.3Z"/></svg>
        <span id="themeLabel">自动</span>
      </button>
    </div>
  </header>

  <main class="main" id="mainUI">

    <div class="intro">
      <p class="eyebrow">文献与数据 · 分析前</p>
      <h1 class="page-title">CSV 清洗与体检</h1>
      <p class="page-desc">问卷平台、Excel、数据库导出的 CSV 先洗一遍：自动认分隔符和编码，把<strong>混合分隔符、引号不闭合、空列、重复行、数字列混入文本</strong>这些问题列出来；清洗动作全部勾选制，只做你确认过的。</p>
    </div>

    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入 CSV 文件">
      <span class="dz-seal" aria-hidden="true">洗</span>
      <p class="dz-text">拖入 CSV / TSV 文件，或 <span class="dz-link">点击选择</span></p>
      <p class="dz-hint">也可以直接把文本粘贴到下方 · 文件不出本机</p>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt,text/csv" hidden />
    </div>

    <textarea id="pasteArea" class="paste-area" spellcheck="false"
      placeholder="或在此粘贴 CSV 文本…（每行一条记录）" rows="6" aria-label="粘贴 CSV 文本"></textarea>

    <section class="panel panel-pad settings" id="settings" hidden>
      <div class="settings-row">
        <div class="field">
          <label for="encodingSel">文件编码</label>
          <select id="encodingSel" class="input">
            <option value="auto">自动检测</option>
            <option value="utf-8">UTF-8</option>
            <option value="gb18030">GB18030 / GBK</option>
          </select>
        </div>
        <div class="field">
          <label for="delimSel">分隔符</label>
          <select id="delimSel" class="input">
            <option value="auto">自动检测</option>
            <option value=",">逗号 ,</option>
            <option value=";">分号 ;</option>
            <option value="\t">制表符 Tab</option>
            <option value="|">竖线 |</option>
          </select>
        </div>
      </div>
      <div class="opts" role="group" aria-label="清洗选项">
        <label class="pill"><input type="checkbox" id="optTrim" checked /><span>去首尾空白与隐形字符</span></label>
        <label class="pill"><input type="checkbox" id="optEmpty" checked /><span>删除空行</span></label>
        <label class="pill"><input type="checkbox" id="optDup" /><span>删除重复行</span></label>
        <label class="pill"><input type="checkbox" id="optHalf" /><span>全角字母数字转半角</span></label>
        <label class="pill"><input type="checkbox" id="optQuote" /><span>中文引号规范化</span></label>
      </div>
    </section>

    <section class="panel panel-pad report" id="reportPanel" hidden aria-label="体检报告">
      <h2 class="panel-title">体检报告 <span class="pane-meta" id="fileMeta"></span></h2>
      <div class="report-facts" id="reportFacts"></div>
      <h3 class="sub-title">列概览</h3>
      <div class="kit-table-wrap">
        <table class="kit-table">
          <thead><tr><th>#</th><th>列名</th><th>类型</th><th>空值</th></tr></thead>
          <tbody id="colBody"></tbody>
        </table>
      </div>
      <h3 class="sub-title">发现的问题</h3>
      <ul class="issue-list" id="issueList"></ul>
    </section>

    <section class="panel panel-pad preview-panel" id="previewPanel" hidden aria-label="清洗结果">
      <h2 class="panel-title">清洗动作 <span class="badge badge-accent" id="actionCount"></span></h2>
      <ul class="action-list" id="actionList"></ul>
      <div class="preview-actions">
        <button class="btn btn-secondary btn-sm" data-act="copy" type="button">复制清洗结果</button>
        <button class="btn btn-secondary btn-sm" data-act="download" type="button">下载 .csv</button>
      </div>
      <div class="kit-table-wrap">
        <table class="kit-table preview-table" id="previewTable"></table>
      </div>
      <p class="footnote" id="previewNote"></p>
    </section>

    <div class="error-box panel panel-pad" id="errorBox" hidden>
      <p id="errorText"></p>
    </div>

  </main>

  <div class="api-result" id="apiResult" hidden></div>

  <footer class="statusbar">
    <span class="statusbar-left">
      <span class="status-dot ready" id="statusDot"></span>
      <span id="statusText" aria-live="polite">就绪</span>
    </span>
    <span class="statusbar-right">
      <span>纯前端 · 不上传</span>
      <span class="sep">·</span>
      <a href="https://github.com/icgma/newsroom-kit" target="_blank" rel="noopener">源码</a>
    </span>
  </footer>

</div>

<script src="csvclean.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
