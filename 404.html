<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · 页面不在工具箱里 — newsroom-kit</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b23a29'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='bold' fill='%23fdf9f0' text-anchor='middle'%3E具%3C/text%3E%3C/svg%3E" />
<style>
  :root { --bg:#171410; --fg:#ece6d8; --fg-soft:#b0a794; --fg-dim:#827a67; --accent:#e0785a; --border:#3d372c;
    --serif:"Palatino Linotype",Palatino,Georgia,"Songti SC",SimSun,serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]), :root[data-theme="light"] { --bg:#f6f4ee; --fg:#26221a; --fg-soft:#5f5849; --fg-dim:#877e6c; --accent:#b23a29; --border:#d7d2c3; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); font-family:var(--sans);
    background-image: radial-gradient(880px 480px at 85% -10%, rgba(224,120,90,.08), transparent 62%); }
  .card { text-align:center; padding:40px 24px; }
  .seal { width:56px; height:56px; margin:0 auto 22px; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fdf9f0; border-radius:10px; font-family:var(--serif);
    font-size:30px; font-weight:700; box-shadow: inset 0 0 0 1.5px rgba(255,253,246,.2); }
  h1 { font-family:var(--serif); font-size:30px; margin:0 0 10px; letter-spacing:.02em; }
  p { color:var(--fg-soft); font-size:14px; margin:0 0 26px; }
  a { display:inline-block; padding:9px 22px; border-radius:7px; background:var(--accent);
    color:#fdf9f0; text-decoration:none; font-size:13px; font-weight:600; }
  a:hover { filter:brightness(1.08); }
  .path { font-family:var(--serif); font-style:italic; color:var(--fg-dim); }
</style>
</head>
<body>
  <div class="card">
    <div class="seal" aria-hidden="true">具</div>
    <h1>404 · 这一页不在工具箱里</h1>
    <p>您访问的 <span class="path" id="path"></span> 不存在，或已经移动。</p>
    <a href="/newsroom-kit/">← 返回便携工具箱</a>
  </div>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
