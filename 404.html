<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · 这一页不在工具箱里 — newsroom-kit</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b23a29'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='18' fill='%23fdf9f0' text-anchor='middle'%3Enk%3C/text%3E%3C/svg%3E" />
<style>
  :root { --bg:#171410; --fg:#ece6d8; --fg-soft:#b0a794; --fg-dim:#827a67; --accent:#e0785a; --border:#3d372c;
    --serif:"Newsreader","Palatino Linotype",Palatino,Georgia,"Songti SC",SimSun,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]), :root[data-theme="light"] { --bg:#f6f4ee; --fg:#26221a; --fg-soft:#5f5849; --fg-dim:#877e6c; --accent:#b23a29; --border:#d7d2c3; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); font-family:var(--sans); }
  .card { text-align:left; padding:40px 28px; max-width:28em; }
  .kicker { font-size:12px; letter-spacing:.16em; color:var(--fg-dim); font-weight:600; margin:0 0 12px; }
  h1 { font-family:var(--serif); font-style:italic; font-size:36px; margin:0 0 12px; letter-spacing:-.02em; font-weight:600; }
  p { color:var(--fg-soft); font-size:14px; margin:0 0 26px; line-height:1.7; }
  a { display:inline-block; padding:9px 16px; border:1px solid var(--accent);
    color:var(--accent); text-decoration:none; font-size:13px; font-weight:600; }
  a:hover { background:var(--accent); color:#fdf9f0; }
  .path { font-family:var(--serif); font-style:italic; color:var(--fg-dim); }
</style>
</head>
<body>
  <div class="card">
    <p class="kicker">newsroom-kit</p>
    <h1>这一页不在工具箱里</h1>
    <p>您访问的 <span class="path" id="path"></span> 不存在，或已经移动。</p>
    <a href="/newsroom-kit/">返回工作台</a>
  </div>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
