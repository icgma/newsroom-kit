  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Web",
  "browserRequirements": "Requires JavaScript",
  "inLanguage": "zh-CN",
  "description": "在浏览器本地压缩图片，控制最长边与画质，导出 JPEG / WebP 并去除 EXIF。",

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b23a29'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='18' fill='%23fdf9f0' text-anchor='middle'%3Ei%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />

<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <a class="back-link" href="../index.html" title="返回工具箱">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M10.5 2 5 8l5.5 6 1.4-1.4L7.8 8l4.1-4.6Z"/></svg>
        工具箱
      </a>
      <span class="seal" aria-hidden="true">图</span>
      <span class="wordmark">imgshrink</span>
      <span class="tag">本地压图</span>
    </div>
    <div class="topbar-right">
      <span class="chip" title="图片只在本机处理">
        <span class="chip-label">数据不上传</span>
      </span>
      <button class="theme-toggle" id="themeToggle" type="button" title="切换主题">
        <svg class="ico-auto" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm0 1.6A5.4 5.4 0 0 0 8 13.4V2.6Z" opacity=".9"/><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm1.2 1.63a5.4 5.4 0 0 1 0 10.74V2.63Z" opacity=".45"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-8.5V.8m0 14.4v-1.7m3.9-9.6 1.2-1.2M2.9 13.1l1.2-1.2m0-7.8L2.9 2.9m10.2 10.2-1.2-1.2M13.5 8h1.7M.8 8h1.7"/></svg>
        <svg class="ico-moon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M6.5 2A6 6 0 0 0 8 13.9 6 6 0 0 1 6.5 2Zm2.8-.9a7.5 7.5 0 1 0 5.6 9.3 6 6 0 0 1-5.6-9.3Z"/></svg>
        <span id="themeLabel">自动</span>
      </button>
    </div>
  </header>

  <main class="main" id="mainUI">
    <div class="intro">
      <p class="eyebrow">图像音视 · 供图</p>
      <h1 class="page-title">本地压图</h1>
      <p class="page-desc">相机原图动辄十几 MB，邮箱和课件都嫌大。拖进来或直接粘贴截图，选最长边和画质。在画布上重绘，<strong>EXIF 会去掉</strong>，图不离开这台电脑。</p>
    </div>

    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入图片">
      <p class="dz-text">拖入图片，粘贴截图，或 <span class="dz-link">点击选择</span></p>
      <p class="dz-hint">JPEG / PNG / WebP / GIF 第一帧 · 不上传</p>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>

    <div class="controls panel panel-pad" id="controls" hidden>
      <div class="field">
        <label for="maxEdge">最长边</label>
        <select id="maxEdge" class="input">
          <option value="1280">1280</option>
          <option value="1600" selected>1600</option>
          <option value="1920">1920</option>
          <option value="2560">2560</option>
          <option value="0">不缩放</option>
        </select>
      </div>
      <div class="field">
        <label for="quality">画质 <span id="qualityLabel" class="num">82%</span></label>
        <input id="quality" class="range" type="range" min="50" max="95" value="82" />
      </div>
      <div class="field">
        <label for="mime">格式</label>
        <select id="mime" class="input">
          <option value="image/jpeg" selected>JPEG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="field field-action">
        <button class="btn btn-primary" data-act="download" type="button">下载</button>
        <button class="btn btn-ghost" data-act="reset" type="button">换一张</button>
      </div>
    </div>

    <div class="compare" id="compare" hidden>
      <figure>
        <figcaption>原图 <span id="srcMeta" class="num"></span></figcaption>
        <img id="srcImg" alt="原图预览" />
      </figure>
      <figure>
        <figcaption>压缩后 <span id="outMeta" class="num"></span></figcaption>
        <img id="outImg" alt="压缩后预览" />
      </figure>
    </div>
  </main>

  <footer class="statusbar">
    <span class="statusbar-left">
      <span class="status-dot ready" id="statusDot"></span>
      <span id="statusText" aria-live="polite">就绪</span>
    </span>
    <span class="statusbar-right">
      <span>纯前端 · 不上传</span>
      <span class="sep">·</span>
      <a href="https://github.com/icgma/newsroom-kit" target="_blank" rel="noopener">源码</a>
    </span>
  </footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
