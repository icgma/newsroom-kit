<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>citecheck — 引文格式互转（APA·Chicago·MLA·GB/T 7714） | newsroom-kit</title>
<meta name="description" content="粘贴 BibTeX、RIS 或一条 APA / Chicago / MLA / GB/T 7714 格式的引文，自动识别并转换为其余格式。中英文作者名、DOI、页码规范处理。纯浏览器运行，数据不上传。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b23a29'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='bold' fill='%23fdf9f0' text-anchor='middle'%3Ec%3C/text%3E%3C/svg%3E" />
<link rel="canonical" href="https://icgma.github.io/newsroom-kit/citecheck/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="newsroom-kit 便携工具箱" />
<meta property="og:title" content="citecheck — 引文格式互转" />
<meta property="og:description" content="APA · Chicago · MLA · GB/T 7714 一键互转，BibTeX / RIS 直接粘贴。" />
<meta property="og:url" content="https://icgma.github.io/newsroom-kit/citecheck/" />
<meta property="og:locale" content="zh_CN" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <a class="back-link" href="../index.html" title="返回工具箱">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M10.5 2 5 8l5.5 6 1.4-1.4L7.8 8l4.1-4.6Z"/></svg>
        工具箱
      </a>
      <span class="seal" aria-hidden="true">c</span>
      <span class="wordmark">citecheck</span>
      <span class="tag">引文格式互转</span>
    </div>
    <div class="topbar-right">
      <span class="chip" title="所有处理在本机浏览器完成">
        <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1 2 4v4c0 3.6 2.6 6.8 6 7.8 3.4-1 6-4.2 6-7.8V4L8 1Zm0 2.2L13 5.4v2.6c0 2.8-2 5.3-5 6.2-3-.9-5-3.4-5-6.2V5.4L8 3.2Z"/></svg>
        <span class="chip-label">数据不上传</span>
      </span>
      <button class="theme-toggle" id="themeToggle" type="button" title="切换主题">
        <svg class="ico-auto" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm0 1.6A5.4 5.4 0 0 0 8 13.4V2.6Z" opacity=".9"/><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm1.2 1.63a5.4 5.4 0 0 1 0 10.74V2.63Z" opacity=".45"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-8.5V.8m0 14.4v-1.7m3.9-9.6 1.2-1.2M2.9 13.1l1.2-1.2m0-7.8L2.9 2.9m10.2 10.2-1.2-1.2M13.5 8h1.7M.8 8h1.7"/></svg>
        <svg class="ico-moon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M6.5 2A6 6 0 0 0 8 13.9 6 6 0 0 1 6.5 2Zm2.8-.9a7.5 7.5 0 1 0 5.6 9.3 6 6 0 0 1-5.6-9.3Z"/></svg>
        <span id="themeLabel">自动</span>
      </button>
    </div>
  </header>

  <main class="main" id="mainUI">

    <div class="intro">
      <p class="eyebrow">文献与数据 · 投稿前</p>
      <h1 class="page-title">引文格式互转</h1>
      <p class="page-desc">粘贴 <strong>BibTeX、RIS</strong>，或一条 <strong>APA / Chicago / MLA / GB/T 7714</strong> 格式的引文（每行一条），自动识别并转换为其余四种。规则引擎只处理可确定的部分，解析不了的会明确告知。</p>
    </div>

    <section class="panel panel-pad">
      <div class="input-head">
        <h2 class="panel-title">输入 <span class="badge badge-accent" id="formatBadge" hidden></span></h2>
        <div class="quick-actions">
          <button class="btn btn-ghost btn-sm" data-act="sample" type="button">填入示例</button>
          <button class="btn btn-ghost btn-sm" data-act="clear" type="button">清空</button>
        </div>
      </div>
      <textarea id="input" class="editor" rows="6" spellcheck="false" aria-label="粘贴引文"
        placeholder="在这里粘贴引文…&#10;&#10;例（任选一种格式）：&#10;王晓明, 李华. 算法管理下的骑手劳动过程研究[J]. 新闻与传播研究, 2024, 51(6): 123-138.&#10;Smith, J. P., & Lee, K. (2021). Media trust in the digital age. Communication Research, 48(2), 210-231.&#10;@article{zhang2023, author={Zhang, Wei}, title={…}, journal={…}, year={2023}}"></textarea>
    </section>

    <section class="outputs" id="outputs" hidden aria-label="转换结果">
      <div class="panel panel-pad out-panel">
        <h2 class="panel-title">APA 7 <button class="btn btn-ghost btn-sm" data-act="copy" data-style="apa" type="button">复制</button></h2>
        <p class="out-text" id="out-apa"></p>
      </div>
      <div class="panel panel-pad out-panel">
        <h2 class="panel-title">Chicago（作者-年份） <button class="btn btn-ghost btn-sm" data-act="copy" data-style="chicago" type="button">复制</button></h2>
        <p class="out-text" id="out-chicago"></p>
      </div>
      <div class="panel panel-pad out-panel">
        <h2 class="panel-title">MLA 9 <button class="btn btn-ghost btn-sm" data-act="copy" data-style="mla" type="button">复制</button></h2>
        <p class="out-text" id="out-mla"></p>
      </div>
      <div class="panel panel-pad out-panel">
        <h2 class="panel-title">GB/T 7714-2015 <button class="btn btn-ghost btn-sm" data-act="copy" data-style="gbt" type="button">复制</button></h2>
        <p class="out-text" id="out-gbt"></p>
      </div>
      <p class="footnote">期刊名与卷号的斜体需在 Word / 文档软件中自行应用；多字段不确定时以原文为准。文本引文解析为尽力而为，建议抽查结果。</p>
    </section>

    <section class="panel panel-pad err-panel" id="errPanel" hidden>
      <p id="errText"></p>
    </section>

  </main>

  <div class="api-result" id="apiResult" hidden></div>

  <footer class="statusbar">
    <span class="statusbar-left">
      <span class="status-dot ready" id="statusDot"></span>
      <span id="statusText" aria-live="polite">就绪</span>
    </span>
    <span class="statusbar-right">
      <span>纯前端 · 不上传</span>
      <span class="sep">·</span>
      <a href="https://github.com/icgma/newsroom-kit" target="_blank" rel="noopener">源码</a>
    </span>
  </footer>

</div>

<script src="citecheck.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
