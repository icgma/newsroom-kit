<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>og card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #f6f4ee;
    color: #26221a;
    font-family: "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif;
    display: flex; align-items: center;
    background-image:
      radial-gradient(900px 500px at 88% -15%, rgba(178,58,41,.09), transparent 62%),
      radial-gradient(700px 420px at 0% 115%, rgba(178,58,41,.07), transparent 60%);
    position: relative; overflow: hidden;
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1.5px solid #d7d2c3;
    border-radius: 18px;
  }
  .inner { padding: 0 96px; width: 100%; display: flex; align-items: center; gap: 56px; }
  .seal {
    flex-shrink: 0;
    width: 172px; height: 172px;
    background: #b23a29;
    color: #fdf9f0;
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 96px; font-weight: 700;
    box-shadow: inset 0 0 0 3px rgba(253,249,240,.25), 0 12px 40px rgba(178,58,41,.28);
  }
  .text { min-width: 0; }
  .eyebrow {
    font-size: 24px; letter-spacing: .35em;
    color: #877e6c;
    margin: 0 0 18px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 {
    margin: 0 0 22px;
    font-size: 74px; font-weight: 600;
    letter-spacing: .02em; line-height: 1.15;
  }
  .rule { width: 92px; height: 6px; background: #b23a29; border-radius: 3px; margin-bottom: 26px; }
  .desc {
    margin: 0;
    font-size: 30px; line-height: 1.6;
    color: #5f5849;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .site {
    position: absolute; right: 56px; bottom: 42px;
    font-size: 24px; color: #877e6c; letter-spacing: .08em;
    font-family: ui-monospace, Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <div class="inner">
    <div class="seal" id="seal">具</div>
    <div class="text">
      <p class="eyebrow">社科研究者的案头仪器</p>
      <h1 id="title">便携工具箱</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="desc" id="desc">统计换算 · 参考文献修复 · 访谈脱敏 · PDF 元数据<br>全部在浏览器本地运行，数据不出本机</p>
    </div>
  </div>
  <div class="site">newsroom-kit</div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("seal").textContent = q.get("seal") || "具";
    document.getElementById("title").textContent = q.get("title") || "便携工具箱";
    if (q.get("desc")) document.getElementById("desc").innerHTML = q.get("desc");
  </script>
</body>
</html>
