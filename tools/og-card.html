<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>og card</title>
<style>
  @font-face {
    font-family: "Newsreader";
    font-style: italic;
    font-weight: 600;
    src: url("../assets/fonts/newsreader-600-italic.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #f6f4ee;
    color: #26221a;
    font-family: "Newsreader", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif;
    display: flex; align-items: center;
    position: relative; overflow: hidden;
  }
  .frame {
    position: absolute; inset: 36px;
    border: 1px solid #c9c0ae;
    border-radius: 0;
    box-shadow: 0 1px 0 #c9c0ae, 0 -1px 0 #c9c0ae;
  }
  .inner { padding: 0 96px; width: 100%; display: flex; align-items: center; gap: 48px; }
  .seal {
    flex-shrink: 0;
    width: 148px; height: 148px;
    background: #b23a29;
    color: #fdf9f0;
    border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 72px; font-weight: 600; font-style: italic;
    box-shadow: inset 0 0 0 1px rgba(253,249,240,.22);
  }
  .text { min-width: 0; }
  h1 {
    margin: 0 0 22px;
    font-size: 74px; font-weight: 600; font-style: italic;
    letter-spacing: -.02em; line-height: 1.15;
  }
  .rule { width: 92px; height: 3px; background: #b23a29; border-radius: 0; margin-bottom: 26px; }
  .desc {
    margin: 0;
    font-size: 30px; line-height: 1.6;
    color: #5f5849;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .site {
    position: absolute; right: 56px; bottom: 42px;
    font-size: 24px; color: #877e6c; letter-spacing: .08em;
    font-family: ui-monospace, Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <div class="inner">
    <div class="seal" id="seal">nk</div>
    <div class="text">
      <h1 id="title">便携工具箱</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="desc" id="desc">写稿 · 核材料 · 访谈脱敏 · 整理文献<br>打开就能用，计算留在这台电脑上</p>
    </div>
  </div>
  <div class="site">newsroom-kit</div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("seal").textContent = q.get("seal") || "nk";
    document.getElementById("title").textContent = q.get("title") || "便携工具箱";
    if (q.get("desc")) document.getElementById("desc").innerHTML = q.get("desc");
  </script>
</body>
</html>
