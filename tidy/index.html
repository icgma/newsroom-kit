  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Web",
  "browserRequirements": "Requires JavaScript",

  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },

<link rel="stylesheet" href="styles.css" />

<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <a class="back-link" href="../index.html" title="返回工具箱">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M10.5 2 5 8l5.5 6 1.4-1.4L7.8 8l4.1-4.6Z"/></svg>
        工具箱
      </a>
      <span class="seal" aria-hidden="true">清</span>
      <span class="wordmark">tidy</span>
      <span class="tag">清稿</span>
    </div>
    <div class="topbar-right">
      <span class="chip" title="所有处理在本机浏览器完成">
        <span class="chip-label">数据不上传</span>
      </span>
      <button class="theme-toggle" id="themeToggle" type="button" title="切换主题">
        <svg class="ico-auto" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm0 1.6A5.4 5.4 0 0 0 8 13.4V2.6Z" opacity=".9"/><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 1 8 1Zm1.2 1.63a5.4 5.4 0 0 1 0 10.74V2.63Z" opacity=".45"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-8.5V.8m0 14.4v-1.7m3.9-9.6 1.2-1.2M2.9 13.1l1.2-1.2m0-7.8L2.9 2.9m10.2 10.2-1.2-1.2M13.5 8h1.7M.8 8h1.7"/></svg>
        <svg class="ico-moon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M6.5 2A6 6 0 0 0 8 13.9 6 6 0 0 1 6.5 2Zm2.8-.9a7.5 7.5 0 1 0 5.6 9.3 6 6 0 0 1-5.6-9.3Z"/></svg>
        <span id="themeLabel">自动</span>
      </button>
    </div>
  </header>

  <main class="main" id="mainUI">
    <div class="intro">
      <p class="eyebrow">文字处理 · 交稿前</p>
      <h1 class="page-title">清稿</h1>
      <p class="page-desc">从 Word、微信、网页拷出来的稿，经常夹着零宽字符、全角字母和乱七八糟的空格。粘进来，改完复制出去。不改遣词，只扫地。</p>
    </div>

    <div class="control-row">
      <div class="opts" role="group" aria-label="清理项">
        <label><input type="checkbox" data-opt="zw" checked /> 零宽字符</label>
        <label><input type="checkbox" data-opt="space" checked /> 空白</label>
        <label><input type="checkbox" data-opt="alnum" checked /> 全角字母数字</label>
        <label><input type="checkbox" data-opt="punct" checked /> 中文标点</label>
        <label><input type="checkbox" data-opt="ellipsis" checked /> 省略号</label>
        <label class="opt-quotes">引号
          <select id="quoteStyle" class="input" aria-label="引号样式">
            <option value="corner" selected>直角「」</option>
            <option value="curly">弯引号 “”</option>
            <option value="straight">直引号 ""</option>
            <option value="off">不动</option>
          </select>
        </label>
      </div>
      <div class="quick-actions">
        <button class="btn btn-ghost btn-sm" data-act="sample" type="button">填入示例</button>
        <button class="btn btn-ghost btn-sm" data-act="clear" type="button">清空</button>
      </div>
    </div>

    <div class="two-pane">
      <section class="pane panel" aria-label="原稿">
        <div class="pane-head">
          <h2 class="panel-title">原稿</h2>
          <span class="pane-meta num" id="inputMeta">0 字</span>
        </div>
        <textarea id="input" class="editor" spellcheck="false" aria-label="粘贴原稿" placeholder="粘贴 Word、微信、网页拷出来的文字…"></textarea>
      </section>
      <section class="pane panel" aria-label="清过的稿">
        <div class="pane-head">
          <h2 class="panel-title">清过的稿</h2>
          <div class="pane-actions">
            <button class="btn btn-secondary btn-sm" data-act="copy-out" type="button">复制</button>
          </div>
        </div>
        <textarea id="output" class="editor" spellcheck="false" readonly aria-label="清过的稿"></textarea>
        <p class="pane-status" id="summary">粘贴后自动清理</p>
      </section>
    </div>
  </main>

  <div class="api-result" id="apiResult" hidden></div>

  <footer class="statusbar">
    <span class="statusbar-left">
      <span class="status-dot ready" id="statusDot"></span>
      <span id="statusText" aria-live="polite">就绪</span>
    </span>
    <span class="statusbar-right">
      <span>纯前端 · 不上传</span>
      <span class="sep">·</span>
      <a href="https://github.com/icgma/newsroom-kit" target="_blank" rel="noopener">源码</a>
    </span>
  </footer>
</div>
<script src="tidy.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
