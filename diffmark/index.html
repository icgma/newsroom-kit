  <main class="main" id="mainUI">
    <div class="intro">
      <p class="eyebrow">文字处理 · 改稿</p>
      <h1 class="page-title">逐字对照</h1>
      <p class="page-desc">左边旧稿，右边新稿。删的划掉，增的加底。中文按字、英文按词。不上传。</p>
    </div>

    <div class="control-row">
      <p class="hint-inline" id="summary">两稿贴进来即可</p>
      <div class="quick-actions">
        <button class="btn btn-ghost btn-sm" data-act="sample" type="button">填入示例</button>
        <button class="btn btn-ghost btn-sm" data-act="swap" type="button">对调</button>
        <button class="btn btn-ghost btn-sm" data-act="clear" type="button">清空</button>
      </div>
    </div>

    <div class="two-pane">
      <section class="pane panel">
        <div class="pane-head"><h2 class="panel-title">旧稿</h2></div>
        <textarea id="old" class="editor" spellcheck="false" aria-label="旧稿" placeholder="改之前的稿…"></textarea>
      </section>
      <section class="pane panel">
        <div class="pane-head"><h2 class="panel-title">新稿</h2></div>
        <textarea id="neu" class="editor" spellcheck="false" aria-label="新稿" placeholder="改之后的稿…"></textarea>
      </section>
    </div>

    <section class="panel panel-pad result" aria-label="对照结果">
      <h2 class="panel-title">对照</h2>
      <div id="view" class="diff-view"></div>
    </section>
  </main>

  <div class="api-result" id="apiResult" hidden></div>
  <footer class="statusbar">
